apiVersion: batch/v1
kind: Job
metadata:
  name: vm-fio-benchmark
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      name: vm-fio-benchmark
      annotations:
        macos-vz-kubelet/nfs-service: "macos-nfs-service"
        macos-vz-kubelet/nfs-mount-path: "/data/shared"
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: macos-robot-secret
      containers:
      - name: macos
        image: placeholder
        imagePullPolicy: IfNotPresent
        command:
          - "/bin/sh"
          - "-c"
          - |
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            NFS_DIR="/Users/Shared/default"
            
            # 1. Wait for NFS to be mounted by the postStart hook
            echo "Waiting for NFS mount at $NFS_DIR..."
            while ! mount | grep -q "$NFS_DIR"; do
              sleep 1
            done
            echo "NFS mounted successfully!"

            # 2. Save the result to the requested directory mapping to /data/shared/results_fio
            mkdir -p "$NFS_DIR/results_fio"
            RESULTS_FILE="$NFS_DIR/results_fio/fio_vm_benchmark_results_$(date +%Y-%m-%d-%H-%M).txt"
            
            echo "=== FIO NFS Storage Benchmark ===" | tee -a "$RESULTS_FILE"
            cd "$NFS_DIR"
            
            echo "--- Random Read Test (Simulating Dataset Dataloader) ---" | tee -a "$RESULTS_FILE"
            fio --name=randread --ioengine=posixaio --rw=randread --bs=4k --size=1G --numjobs=4 --iodepth=32 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            
            # Cleanup the temporary workload files generated by fio, but KEEP the results text file!
            rm -f "$NFS_DIR"/randread*
            
            echo "=== FIO Benchmark Completed ===" | tee -a "$RESULTS_FILE"
            echo "All results saved to: $RESULTS_FILE"
            
        lifecycle:
          postStart:
             exec:
               command:
                 - "/bin/sh"
                 - "-c"
                 - |
                   NFS_DIR="/Users/Shared/default"

                   if [ -z "$NFS_SERVER_IP" ] || [ -z "$NFS_NODEPORT" ]; then
                     echo "FAIL: NFS_SERVER_IP or NFS_NODEPORT not set"
                     exit 1
                   fi
                   
                   # Just the lightweight mount goes in the hook which guarantees it finishes in under the 10 seconds timeout.
                   sudo mkdir -p "$NFS_DIR"
                   sudo mount -t nfs -o vers=3,port="$NFS_NODEPORT",mountport="$NFS_NODEPORT",noresvport,noowners,rw,tcp "$NFS_SERVER_IP":/ "$NFS_DIR"

                   sleep 2
                   
        resources:
          requests:
            cpu: "10"
            memory: "12Gi"
          limits:
            cpu: "10"
            memory: "14Gi"
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"
