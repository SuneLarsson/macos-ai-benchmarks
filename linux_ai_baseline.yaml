apiVersion: batch/v1
kind: Job
metadata:
  name: linux-fio-benchmark
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: macos-robot-secret
      containers:
      - name: linux-llm
        image: placeholder
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        command:
          - "/bin/bash"
          - "-c"
          - |
            CEPH_DIR="/data/shared"
            SCRIPT_DIR="$CEPH_DIR/benchmarks"
            OUTPUT_DIR="$CEPH_DIR/results_linux"

            bash "$SCRIPT_DIR/run_ai_suite.sh" --runs 1000 --output-dir "$OUTPUT_DIR" --seed 8 --test "llm" 2>&1 | tee "$CEPH_DIR/benchmark.log"
        volumeMounts:
        - name: project-storage
          mountPath: /data/shared
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: project-storage
        persistentVolumeClaim:
          claimName: your-pvc-name
      - name: tmp-volume
        emptyDir: {}