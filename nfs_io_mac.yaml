apiVersion: batch/v1
kind: Job
metadata:
  name: macos-fio-benchmark
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        macos-exec-kubelet/nfs-service: "macos-nfs-service"
        macos-exec-kubelet/nfs-mount-path: "/data/shared"
    spec:
      restartPolicy: Never
      containers:
      - name: macos-fio
        image: placeholder
        command:
          - "/bin/zsh"
          - "-c"
          - |
            NFS_DIR="/private/tmp/default"
            
            echo "=== FIO NFS Storage Benchmark ==="
            cd "$NFS_DIR"
            
            if ! command -v fio &> /dev/null; then
              echo "Error: fio is not installed on this macOS runner."
              echo "Please install it via HOMEBREW: brew install fio"
              exit 1
            fi
            
            echo "--- 1. Sequential Write Test (Simulating Checkpoint Save) ---"
            fio --name=seqwrite --ioengine=posixaio --rw=write --bs=1M --size=2G --numjobs=1 --iodepth=16 --directory="$NFS_DIR"
            
            echo "--- 2. Sequential Read Test (Simulating Model Load) ---"
            fio --name=seqread --ioengine=posixaio --rw=read --bs=1M --size=2G --numjobs=1 --iodepth=16 --directory="$NFS_DIR"
            
            echo "--- 3. Random Read Test (Simulating Dataset Datalaoder) ---"
            fio --name=randread --ioengine=posixaio --rw=randread --bs=4k --size=1G --numjobs=4 --iodepth=32 --directory="$NFS_DIR"
            
            # Cleanup
            rm -f "$NFS_DIR"/seqwrite* "$NFS_DIR"/seqread* "$NFS_DIR"/randread*
            
            echo "=== FIO Benchmark Completed ==="
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"
